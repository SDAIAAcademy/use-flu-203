<section>
<h2>اليوم 1: قبل البحث وأثناءه: الموجز والادعاءات والمصادر</h2>
<ol>
<li><p>كتب زميلك: «السؤال: هل تقلل برادات الماء في المدارس زيادة الوزن؟ النطاق: طلاب المرحلة الابتدائية منذ 2009. المصادر: دراسات محكّمة وإحصاء رسمي. الخطة: بحث بالعربية والإنجليزية في فهارس الأبحاث». أي نقطة من الخمس غائبة؟</p><ul><li><b>أ.</b> السؤال، لأنه قصير</li><li><b>ب.</b> القرار والموعد: لا نعرف من سيقرر ماذا، ولا متى</li><li><b>ج.</b> معايير المصادر، لأنه لم يسمِّ مواقع بعينها</li><li><b>د.</b> خطة البحث، لأنه لم يذكر أداة ذكاء اصطناعي</li></ul></li>
<li><p>في تقرير مولَّد: «توصي منظمة الصحة العالمية بألا تتجاوز السكريات الحرة 10% من مجموع الطاقة اليومية». ما نوعه، وما فحصه؟</p><ul><li><b>أ.</b> إحصائية: أبحث عن الجدول الذي فيه 10%</li><li><b>ب.</b> حقيقة: المنظمة معروفة، فلا يحتاج إلى فحص</li><li><b>ج.</b> اقتباس: أبحث عن التسجيل الأصلي</li><li><b>د.</b> قاعدة: أفتح نص الإرشاد النافذ من موقع المنظمة نفسها</li></ul></li>
<li><p>وصلتك ورقة أنيقة من «معهد» لم تسمع به، فيها أرقام من مسح رسمي وخلاصة تعارض مقترح جهتك. أمامك دقيقتان. ماذا تفعل أولًا؟</p><ul><li><b>أ.</b> أغادر الورقة وأبحث عن المعهد: من أسسه ومن يموّله، في سجل أو عند جهة أخرى</li><li><b>ب.</b> أقرأ الورقة كاملة بعناية لأحكم على منهجها</li><li><b>ج.</b> أفتح صفحة «من نحن» في موقع المعهد</li><li><b>د.</b> أستبعدها لأنها تعارض مقترحنا</li></ul></li>
<li><p>جدول رسمي يقول: «31.4% من طلاب المرحلة الثانوية يشربون مشروبًا محلّى يوميًا». وكتب موقع إخباري: «مسح رسمي: 31.4% من الطلاب يشربون مشروبًا محلّى يوميًا». ما الذي تغيّر؟</p><ul><li><b>أ.</b> لا شيء: الرقم مطابق للجدول</li><li><b>ب.</b> درجة اليقين: الوصف صار ادعاءً سببيًا</li><li><b>ج.</b> النطاق: رقم مرحلة واحدة صار رقم جميع الطلاب</li><li><b>د.</b> الكلمات: الاقتباس محرّف</li></ul></li>
<li><p>أي صياغة تصلح سؤالًا لموجز بحث عن الدوام المرن في جهة حكومية؟</p><ul><li><b>أ.</b> ما أثر الدوام المرن؟</li><li><b>ب.</b> هل يقلل السماح ببدء الدوام بين السابعة والتاسعة صباحًا أيام الغياب القصير لموظفي المكاتب؟</li><li><b>ج.</b> لماذا يجب أن نطبق الدوام المرن؟</li><li><b>د.</b> ما كل ما كُتب عن الدوام المرن والإنتاجية والرضا والصحة؟</li></ul></li>
<li><p>موجز بحث نطاقه: «كل الدراسات المتاحة عن الموضوع». ما أول ما يحدث حين يُشغَّل في أداة بحث معمق؟</p><ul><li><b>أ.</b> تعود الأداة بتقرير أدق لأن النطاق أوسع</li><li><b>ب.</b> ترفض الأداة التشغيل حتى يُحدَّد النطاق</li><li><b>ج.</b> تملأ الأداة النطاق المتروك بما تجده، ولا يعرف الباحث متى يتوقف</li><li><b>د.</b> لا شيء: النطاق يهم القارئ لا الأداة</li></ul></li>
<li><p>السؤال: «ما رأي مشغلي المقاصف في المقترح؟». أي مصدر يُعد دليلًا أوليًا لهذا السؤال؟</p><ul><li><b>أ.</b> محضر اللقاء المفتوح مع المشغلين واستطلاعه</li><li><b>ب.</b> تجربة عشوائية عن أثر منع العصائر في استهلاك السكر</li><li><b>ج.</b> خبر صحفي عنوانه «المشغلون يرفضون القرار»</li><li><b>د.</b> إجابة مساعد ذكي تلخص موقف المشغلين</li></ul></li>
<li><p>بحثت زميلتك بالعربية فقط عن دراسات محكّمة في أثر برادات الماء في المدارس، فلم تجد شيئًا، وكتبت: «لا توجد دراسات». ما الخلل؟</p><ul><li><b>أ.</b> لا خلل: إن لم تظهر بالعربية فهي غير موجودة</li><li><b>ب.</b> كان عليها أن تسأل المساعد بدل محرك البحث</li><li><b>ج.</b> الدراسات المحكّمة لا تفيد قرارًا محليًا</li><li><b>د.</b> خطة البحث ناقصة: أغلب الدراسات المحكّمة بالإنجليزية، والاستنتاج يُكتب بحدود ما بُحث فيه</li></ul></li>
<li><p>«انخفضت حوادث الطرق 18% بسبب الكاميرات الجديدة». ما النوع الذي يحدد أول فحص لهذا الادعاء؟</p><ul><li><b>أ.</b> إحصائية: يكفي أن أجد 18% في جدول رسمي</li><li><b>ب.</b> حقيقة: الكاميرات رُكّبت فعلًا</li><li><b>ج.</b> ادعاء سببي: ما الذي في تصميم الدراسة يستبعد الأسباب الأخرى؟</li><li><b>د.</b> توقع: لأنه يتحدث عن أثر</li></ul></li>
<li><p>في تقرير مولَّد: «قال الوزير: سنضاعف عدد المدارس الرقمية». ما الفحص الذي يحتاج إليه هذا الادعاء؟</p><ul><li><b>أ.</b> النص أو التسجيل الأصلي لكلام الوزير كاملًا، بسياقه</li><li><b>ب.</b> البحث عن الجملة نفسها في ثلاثة مواقع إخبارية</li><li><b>ج.</b> سؤال المساعد: هل أنت متأكد من الاقتباس؟</li><li><b>د.</b> جدول عدد المدارس الرقمية في الإحصاء الرسمي</li></ul></li>
<li><p>«تنص اللائحة على مهلة 30 يومًا للاعتراض». كيف تتحقق؟</p><ul><li><b>أ.</b> أجد الجملة في صفحة رسمية، فأعتمدها</li><li><b>ب.</b> أسأل زميلًا في الإدارة القانونية وأنقل جوابه</li><li><b>ج.</b> أبحث عن اللائحة في خبر عن صدورها</li><li><b>د.</b> أفتح نص اللائحة النافذ اليوم عند الجهة التي أصدرتها، وأتحقق من حالتها وتاريخ سريانها</li></ul></li>
<li><p>في تقرير عشرون ادعاءً وأمامك ساعة. بأيها تبدأ؟</p><ul><li><b>أ.</b> بالأسهل فحصًا لأغطي أكبر عدد</li><li><b>ب.</b> بالادعاءات التي تسقط الخلاصة إن سقطت</li><li><b>ج.</b> بالادعاءات الأولى في التقرير بالترتيب</li><li><b>د.</b> بالادعاءات التي فيها أرقام فقط</li></ul></li>
<li><p>موقع لم تسمع به ينشر «دراسة» تؤيد ما تريد قوله في تقريرك. ما القراءة الجانبية هنا؟</p><ul><li><b>أ.</b> أن تقرأ الدراسة كاملة ثم تحكم</li><li><b>ب.</b> أن تتحقق من أن الموقع ينتهي بنطاق يوحي بالثقة</li><li><b>ج.</b> أن تفتح تبويبات جديدة تسأل غير الموقع عنه وعن الدراسة</li><li><b>د.</b> أن تقارن تصميم الموقع بمواقع رسمية</li></ul></li>
<li><p>ورقة من مؤسسة يموّلها اتحاد منتجين، فيها رقم من مسح رسمي يخدم موقف الاتحاد. كيف تتعامل معها؟</p><ul><li><b>أ.</b> أستبعدها: صاحب المصلحة لا يوثق به أبدًا</li><li><b>ب.</b> أتتبع الرقم إلى جدول المسح، وإن ذكرت الورقة ذكرت من يموّلها</li><li><b>ج.</b> أعتمدها: الرقم من مسح رسمي</li><li><b>د.</b> أسأل المؤسسة هل هي مستقلة</li></ul></li>
<li><p>استشهد مساعد بصفحة في موقع وزارة فيها ضوابط صدرت قبل ثلاث سنوات. الصفحة تعمل وعليها شعار الوزارة. ما الذي ينقص قبل الاستشهاد؟</p><ul><li><b>أ.</b> لا شيء: المصدر رسمي والصفحة تعمل</li><li><b>ب.</b> رابط ثانٍ من موقع إخباري يذكر الضوابط نفسها</li><li><b>ج.</b> تأكيد من المساعد أن الضوابط سارية</li><li><b>د.</b> حالة الضوابط اليوم عند الوزارة: هل هي نافذة أم حلّ محلها أحدث؟</li></ul></li>
<li><p>دراسة تقول: «ارتبط البرنامج بانخفاض الغياب 9% في مدارس التجربة». وخبر يقول: «البرنامج يخفض الغياب 9%». ما الذي تغيّر؟</p><ul><li><b>أ.</b> الرقم</li><li><b>ب.</b> درجة اليقين والنطاق: «ارتبط» صارت «يخفض»، وسقطت «في مدارس التجربة»</li><li><b>ج.</b> لا شيء يهم: المعنى واحد</li><li><b>د.</b> الكلمات: الاقتباس محرّف</li></ul></li>
<li><p>وصلتك لقطة شاشة لجدول «رسمي» بلا رابط، وتريد أن تستشهد برقم فيه. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> أستشهد باللقطة وأكتب «المصدر: جدول رسمي»</li><li><b>ب.</b> أطلب من مساعد أن يقرأ اللقطة ويؤكد الرقم</li><li><b>ج.</b> أبحث عن الصفحة التي التُقطت منها، وإن لم أجدها كتبت أني لم أصل إلى الأصل ولم أستشهد بالرقم</li><li><b>د.</b> أبحث عن الرقم في مواقع التواصل لأرى هل تكرر</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الاستشهادات وأدوات البحث والتقرير</h2>
<ol>
<li><p>أمس نقل تقرير «مُنقِّب» حد السكر «10 غ لكل 100 مل» من صفحة معيار في موقع الهيئة نفسها. ما الذي كشف أن الرقم لم يعد صحيحًا؟</p><ul><li><b>أ.</b> ملاحظة في أعلى الصفحة تقول إنها ملغاة</li><li><b>ب.</b> سؤال المساعد: هل هذا المعيار نافذ؟</li><li><b>ج.</b> صفحة الأنظمة واللوائح عند الهيئة، وفيها حالة كل معيار وتاريخ سريانه</li><li><b>د.</b> تصميم الصفحة القديم</li></ul></li>
<li><p>مرجع في إجابة مساعد: مؤلفون معروفون في المجال، ومجلة معروفة، ومعرِّف رقمي. حللتَ المعرِّف ففتح مقالًا في المجلة نفسها، بعنوان آخر ومؤلف آخر. ماذا تفعل؟</p><ul><li><b>أ.</b> أبحث عن العنوان المذكور كاملًا في فهرس للأبحاث، وإن لم يوجد حكمت بأن المرجع مختلق وحذفت ادعاءه</li><li><b>ب.</b> أعتمده: المعرِّف ينحلّ والمجلة صحيحة</li><li><b>ج.</b> أستشهد بالمقال الذي فتحه المعرِّف بدلًا منه</li><li><b>د.</b> أطلب من المساعد المعرِّف الصحيح وأضعه</li></ul></li>
<li><p>سألتَ دفترًا عن مهلة الاعتراض في لائحة جهتك، فأجاب «30 يومًا» واستشهد بمقطع يقول ذلك نصًّا. ما الذي بقي عليك؟</p><ul><li><b>أ.</b> لا شيء: الإجابة مستندة والمقطع يدعمها</li><li><b>ب.</b> أن أسأل الدفتر: هل أنت متأكد؟</li><li><b>ج.</b> أن أحمّل مستندات أكثر وأعيد السؤال</li><li><b>د.</b> أن أتحقق من أن المستند المستشهد به هو النسخة النافذة من اللائحة</li></ul></li>
<li><p>السؤال: «ما حصة الماء من مبيعات المشروبات؟». الإجابة: «41% من العبوات المبيعة، وهي في ارتفاع مستمر». المقطع المستشهد به: «حصة كل صنف من العبوات المبيعة: الماء 41%، والعصائر المحلاة 27%…». ما الحكم؟</p><ul><li><b>أ.</b> مدعوم: الرقم 41% في المقطع</li><li><b>ب.</b> مدعوم جزئيًا: الحصة في المقطع، و«في ارتفاع مستمر» ليست فيه</li><li><b>ج.</b> غير مدعوم: في الإجابة ما ليس في المقطع</li><li><b>د.</b> امتناع صحيح</li></ul></li>
<li><p>نتيجتك: «حظر المشروبات المحلاة في المدارس قلّل شراءها داخل المدرسة ولم يقلل الاستهلاك الكلي». دليلها دراسة واحدة مقطعية، من بلد آخر، بياناتها عمرها نحو عشرين سنة، قرأتَ ملخصها. أي إفادة أصدق؟</p><ul><li><b>أ.</b> ثقة منخفضة إلى متوسطة: مصدر أصلي قرأنا ملخصه، لكنه مقطعي لا يثبت سببًا، ومن سياق آخر وزمن أقدم. يغيّرها: دراسة بمجموعة مقارنة في سياق قريب</li><li><b>ب.</b> ثقة عالية: الدراسة منشورة في مجلة طبية محكّمة</li><li><b>ج.</b> قد لا تنطبق هذه النتيجة تمامًا، ويُنصح بالحذر</li><li><b>د.</b> لا تُذكر النتيجة: الدليل ضعيف</li></ul></li>
<li><p>في إجابة مساعد مرجع بمعرِّف رقمي. ضغطت المعرِّف ففتح صفحة مقال في مجلة معروفة. ما الخطوة التالية؟</p><ul><li><b>أ.</b> أعتمد الاستشهاد: المعرِّف يعمل</li><li><b>ب.</b> أطابق عنوان المقال ومؤلفيه ومجلته وسنته بما كتبه المساعد، ثم أقرأ هل يدعم الادعاء</li><li><b>ج.</b> أنسخ المرجع إلى تقريري بصيغة التوثيق المطلوبة</li><li><b>د.</b> أبحث عن مرجع ثانٍ للادعاء نفسه</li></ul></li>
<li><p>مرجع فيه مؤلفون حقيقيون في المجال ومجلة حقيقية، ومعرِّفه ينحلّ إلى مقال في المجلة نفسها عن موضوع آخر تمامًا. ما حكمك؟</p><ul><li><b>أ.</b> سليم: المؤلفون والمجلة حقيقيون</li><li><b>ب.</b> خطأ مطبعي في المعرِّف لا يهم</li><li><b>ج.</b> مرجع مركَّب: أبحث بالعنوان كاملًا، وإن لم يوجد المقال فالمرجع مختلق</li><li><b>د.</b> ورقة مسحوبة</li></ul></li>
<li><p>إجابة تقول: «كل ضريبة 10% تخفض المشتريات 20%»، والملخص المستشهد به يقول: «ضريبة تعادل 10% ارتبطت بانخفاض متوسطه 10.0%». المرجع موجود ومنسوب بدقة. ما القرار؟</p><ul><li><b>أ.</b> يُعتمد: المرجع حقيقي والمجلة محكّمة</li><li><b>ب.</b> يُحذف المرجع لأنه لا يوثق به</li><li><b>ج.</b> يُترك كما هو مع عبارة «بحسب دراسة»</li><li><b>د.</b> يُصحَّح الرقم ودرجة اليقين كما في المصدر: 10.0%، و«ارتبطت»</li></ul></li>
<li><p>سجل مقال في فهرس علمي يبدأ عنوانه بكلمة RETRACTED. المساعد استشهد به دليلًا. ماذا تفعل؟</p><ul><li><b>أ.</b> أحذف الادعاء الذي يقوم عليه، أو أبحث له عن دليل غير مسحوب</li><li><b>ب.</b> أعتمده: نُشر في مجلة محكّمة</li><li><b>ج.</b> أعتمده مع حاشية تقول إنه مسحوب</li><li><b>د.</b> أتجاهل الكلمة: هي خطأ في الفهرس</li></ul></li>
<li><p>دفتر مستند إلى المصادر أجاب عن سؤال واستشهد بمقطع. ما الذي تضمنه كلمة «مستند» فعلًا؟</p><ul><li><b>أ.</b> أن الإجابة صحيحة</li><li><b>ب.</b> أن الإجابة مأخوذة من مستنداتك، مع مقطع تستطيع أن تفتحه وتقارنه</li><li><b>ج.</b> أن المستند المستشهد به أحدث ما عندك</li><li><b>د.</b> أن الدفتر لن يجيب عما ليس في المستندات</li></ul></li>
<li><p>تبني دفترًا لأسئلة عن معيار نافذ، وعندك نسخته الملغاة أيضًا. ما التصرف الأسلم؟</p><ul><li><b>أ.</b> أحمّل النسختين: كلما زادت المصادر تحسّن الجواب</li><li><b>ب.</b> أحمّل الملغاة فقط لأنها أقدم وأشهر</li><li><b>ج.</b> أحمّل النافذة، وإن احتجت إلى الملغاة للمقارنة سمّيتها بوضوح وراقبت استشهاد كل إجابة</li><li><b>د.</b> لا فرق: الدفتر يميز النافذ من الملغى بنفسه</li></ul></li>
<li><p>الإجابة: «رُكّب 2,150 برادًا في 1,010 مدرسة بتكلفة 4 ملايين ريال». المقطع المستشهد به يذكر العددين ولا يذكر تكلفة. ما الحكم؟</p><ul><li><b>أ.</b> مدعوم: العددان صحيحان</li><li><b>ب.</b> غير مدعوم: في الإجابة خطأ</li><li><b>ج.</b> امتناع خاطئ</li><li><b>د.</b> مدعوم جزئيًا: ادعاءان في المقطع، والثالث ليس فيه</li></ul></li>
<li><p>من عشرين إجابة: 12 مدعومة، و3 مدعومة جزئيًا، و3 غير مدعومة، وامتناعان صحيحان. كتب زميلك: «معدل الدعم 67%». ما الذي ينقص جملته؟</p><ul><li><b>أ.</b> المقام: 12 من 18 إجابة قدّمت ادعاءً، والامتناعان يُذكران منفصلين</li><li><b>ب.</b> لا شيء: الرقم صحيح</li><li><b>ج.</b> اسم الأداة التي حسبت المعدل</li><li><b>د.</b> الرقم خاطئ: المعدل 60%</li></ul></li>
<li><p>إجابة مدعومة تمامًا بمقطعها، والمقطع من معيار ملغى. كيف تسجّلها؟</p><ul><li><b>أ.</b> غير مدعوم</li><li><b>ب.</b> مدعوم، ولا ملاحظة</li><li><b>ج.</b> مدعوم، مع ملاحظة أن المستند ملغى، ولا يُعتمد جوابها</li><li><b>د.</b> امتناع صحيح</li></ul></li>
<li><p>أي سطر يصلح في سجل تحقق؟</p><ul><li><b>أ.</b> «الرقم 14.2%: تحققت منه»</li><li><b>ب.</b> «الرقم 14.2%: المساعد أكّد أنه صحيح»</li><li><b>ج.</b> «الرقم 14.2%: الرابط يعمل»</li><li><b>د.</b> «الرقم 14.2%: جاء من تقرير المساعد، وفتحت الدراسة، وهو في جدول النتائج، السطر الأول. القرار: يُعتمد»</li></ul></li>
<li><p>نتيجة تقوم على تجربة واحدة محكّمة، لعام واحد، في مرحلة دراسية واحدة. أي إفادة ثقة أصدق؟</p><ul><li><b>أ.</b> ثقة عالية: الدراسة تجربة عشوائية محكّمة</li><li><b>ب.</b> ثقة متوسطة: تجربة محكّمة قرأنا جدولها، لكنها واحدة، لعام ومرحلة. يغيّرها تجربة ثانية أو قياس أطول</li><li><b>ج.</b> ثقة منخفضة: لا يوثق بدراسة واحدة أبدًا</li><li><b>د.</b> لا حاجة إلى إفادة: النتيجة تتكلم عن نفسها</li></ul></li>
<li><p>بحثت عن دراسات خليجية في سؤالك ولم تجد. ماذا تكتب في الموجز؟</p><ul><li><b>أ.</b> لا أكتب شيئًا: ما لم أجده لا يهم القارئ</li><li><b>ب.</b> «لا توجد دراسات خليجية»</li><li><b>ج.</b> أطلب من المساعد دراسة خليجية وأضيفها</li><li><b>د.</b> في القيود المتبقية: «لم نجد دراسة منشورة من دول الخليج العربي، وبحثنا بالعربية والإنجليزية في كذا وكذا»</li></ul></li>
<li><p>تريد أن تبحث بمساعد عام عن سؤال، وعندك شكوى فيها اسم طالب وحالته الصحية توضح المشكلة. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> ألصق الشكوى: السياق يحسّن البحث</li><li><b>ب.</b> ألصقها وأطلب من المساعد ألا يحتفظ بها</li><li><b>ج.</b> أكتب السؤال البحثي دون الشكوى: السؤال لا يحتاج إلى اسم ولا حالة</li><li><b>د.</b> أحذف الاسم وأبقي المدرسة والحالة الصحية والتاريخ</li></ul></li>
</ol>
